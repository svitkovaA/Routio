services:
  db:
    container_name: routio-db
    restart: unless-stopped
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend-db

  backend:
    container_name: routio-backend
    restart: unless-stopped
    image: dexter.fit.vutbr.cz/routio/routio-backend
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TZ: Europe/Bratislava
      PRODUCTION: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - routioNetwork
      - backend-db

  frontend:
    container_name: routio-frontend
    restart: unless-stopped
    image: dexter.fit.vutbr.cz/routio/routio-frontend
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first, nginx listens on IPv4 only
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/routio/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - routioNetwork

  proxy:
    container_name: routio-proxy
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - routioNetwork
      - edge

networks:
  # Shared only with base nginx (PROJECT_EDGE_NETWORK_Routio in dexter.conf), not kristyna-dev
  edge:
    name: routio-edge
  routioNetwork:
    name: routioNetwork
  backend-db:
    name: backend-db

volumes:
  pgdata:
